[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conseg"
version = "0.1.0"
description = "Conformal prediction-based uncertainty for segmentation model outputs (nnU-Net and others): uncertainty maps, case-level uncertainty ratio, and review flagging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "SimpleITK>=2.1",
  "pandas>=1.3",
  "PyYAML>=5.4",
  "matplotlib>=3.4",
]
keywords = ["conformal prediction", "uncertainty quantification", "segmentation", "nnU-Net", "medical imaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
conseg = "conseg.cli:main"

[tool.setuptools]
packages = ["conseg", "conseg.templates"]

[tool.setuptools.package-data]
"conseg.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
